<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%">
      <stop offset="0" stop-color="#063b36"/>
      <stop offset=".65" stop-color="#021d20"/>
      <stop offset="1" stop-color="#010b0d"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#baffc8"/>
      <stop offset=".45" stop-color="#35ff68"/>
      <stop offset="1" stop-color="#00b83f"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#aebbc5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Badge -->
  <circle cx="512" cy="512" r="470" fill="url(#bg)" stroke="#39ff68" stroke-width="18"/>
  <circle cx="512" cy="512" r="447" fill="none" stroke="#9affad" stroke-width="4" opacity=".8"/>

  <!-- Globe -->
  <circle cx="512" cy="420" r="250" fill="#063d3a" stroke="#27e86a" stroke-width="5" opacity=".95"/>
  <path d="M270 420h484M300 330h424M300 510h424" fill="none" stroke="#24c96a" opacity=".25" stroke-width="3"/>
  <ellipse cx="512" cy="420" rx="105" ry="250" fill="none" stroke="#24c96a" opacity=".35" stroke-width="3"/>
  <ellipse cx="512" cy="420" rx="190" ry="250" fill="none" stroke="#24c96a" opacity=".2" stroke-width="3"/>
  <path d="M315 395c65-70 95-105 160-80 60 24 90-35 150-10 45 19 70 5 95-25"
        fill="none" stroke="#0b1718" stroke-width="42" stroke-linecap="round" opacity=".9"/>
  <path d="M340 485c60-42 95-30 145-65 65-45 105 12 190-28"
        fill="none" stroke="#0b1718" stroke-width="45" stroke-linecap="round" opacity=".9"/>

  <!-- Orbital ring -->
  <ellipse cx="512" cy="420" rx="365" ry="115" fill="none" stroke="#48ff7a" stroke-width="8" opacity=".8"
           transform="rotate(-12 512 420)"/>

  <!-- Servers -->
  <g transform="translate(690 330)">
    <rect x="0" y="0" width="190" height="70" rx="14" fill="#101f2a" stroke="#3b5662" stroke-width="5"/>
    <rect x="20" y="90" width="210" height="70" rx="14" fill="#101f2a" stroke="#3b5662" stroke-width="5"/>
    <rect x="-5" y="180" width="230" height="70" rx="14" fill="#101f2a" stroke="#3b5662" stroke-width="5"/>
    <g fill="#35ff68">
      <circle cx="30" cy="35" r="8"/><circle cx="55" cy="35" r="8"/>
      <circle cx="50" cy="125" r="8"/><circle cx="75" cy="125" r="8"/>
      <circle cx="30" cy="215" r="8"/><circle cx="55" cy="215" r="8"/>
    </g>
  </g>

  <!-- Robot body -->
  <g>
    <ellipse cx="500" cy="730" rx="230" ry="48" fill="#000" opacity=".45" filter="url(#soft)"/>
    <rect x="320" y="570" width="380" height="250" rx="105" fill="url(#white)" stroke="#17262c" stroke-width="12"/>
    <rect x="430" y="690" width="145" height="70" rx="35" fill="#071619" stroke="#2dff67" stroke-width="8"/>
    <path d="M475 725l22 22 48-53" fill="none" stroke="#43ff73" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Head -->
    <rect x="300" y="300" width="430" height="300" rx="105" fill="url(#white)" stroke="#17262c" stroke-width="14"/>
    <rect x="355" y="350" width="320" height="205" rx="70" fill="#031115" stroke="#344e59" stroke-width="8"/>

    <!-- Eyes -->
    <path d="M425 440q30-35 60 0" fill="none" stroke="#42ff72" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M550 440q30-35 60 0" fill="none" stroke="#42ff72" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M493 480q20 20 40 0" fill="none" stroke="#42ff72" stroke-width="10" stroke-linecap="round"/>

    <!-- Antenna -->
    <path d="M510 300v-42" stroke="#c8d3d8" stroke-width="10"/>
    <circle cx="510" cy="235" r="25" fill="url(#green)" stroke="#102329" stroke-width="8"/>

    <!-- Ears -->
    <rect x="275" y="395" width="55" height="105" rx="27" fill="#b9c5ca" stroke="#17262c" stroke-width="10"/>
    <rect x="700" y="395" width="55" height="105" rx="27" fill="#b9c5ca" stroke="#17262c" stroke-width="10"/>
    <circle cx="303" cy="448" r="15" fill="#35ff68"/>
    <circle cx="727" cy="448" r="15" fill="#35ff68"/>

    <!-- Arms -->
    <path d="M330 640c-70 20-90 90-20 120 55 23 105-15 95-70"
          fill="url(#white)" stroke="#17262c" stroke-width="13" stroke-linecap="round"/>
    <path d="M680 650c65 10 105 55 75 105-30 48-90 30-105-12"
          fill="url(#white)" stroke="#17262c" stroke-width="13" stroke-linecap="round"/>

    <!-- Thumb up -->
    <path d="M305 665c-18-52 22-90 58-61l2 38 27-35c18-23 52-3 39 24l-32 65c-10 20-28 30-51 27l-35-4c-20-3-31-25-20-54z"
          fill="#fff" stroke="#17262c" stroke-width="10"/>
  </g>

  <!-- Cloud -->
  <g transform="translate(720 575)">
    <path d="M20 115c-5-55 38-85 76-77 18-60 108-62 132 5 55-14 96 31 85 72-9 34-42 49-82 49H77c-32 0-54-17-57-49z"
          fill="url(#white)" stroke="#17262c" stroke-width="10"/>
    <path d="M155 155V55M115 95l40-40 40 40" fill="none" stroke="#0cae43" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Heartbeat -->
  <path d="M100 825h150l35-35 45 35h160l35-60 35 60h70l30-115 35 115h145"
        fill="none" stroke="#46ff73" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Wordmark -->
  <text x="512" y="930" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="78" font-weight="900" font-style="italic"
        fill="#f4f7f8" stroke="#071214" stroke-width="8" paint-order="stroke">
    UpTime<tspan fill="#38ff6d">Robot</tspan>
  </text>
</svg>
